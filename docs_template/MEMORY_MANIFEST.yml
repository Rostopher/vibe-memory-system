version: 1
purpose: "Project memory manifest for Agents. Use it to decide what to read and where to write updates."

read_order:
  minimal:
    - docs/README.md
    - docs/OVERVIEW.md
    - docs/STATUS.md
    - docs/RUNBOOK.md
    - docs/CONVENTIONS.md
  expanded:
    - docs/DECISIONS.md
    - docs/GLOSSARY.md
    - docs/PROGRESS.md
    - docs/MAP.md
  on_demand:
    - docs/SHORT_MEMORY/
    - docs/archive/
    - docs/ASK_YOUR_AGENT.md

layers:
  base:
    purpose: "Stable facts that should be reused across sessions."
    files:
      - path: docs/README.md
        role: "Docs entry point and routing rules."
        update_mode: patch
        read_when: ["entering_project", "deciding_which_docs_to_read"]
        update_when: ["docs_structure_changed", "read_order_changed"]
      - path: docs/OVERVIEW.md
        role: "High-level project purpose, workstreams, architecture, and directories."
        update_mode: rewrite
        read_when: ["entering_project", "architecture_question"]
        update_when: ["project_scope_changed", "architecture_changed", "main_workstreams_changed"]
      - path: docs/STATUS.md
        role: "Current high-level project state."
        update_mode: rewrite
        read_when: ["entering_project", "planning_work", "status_question"]
        update_when: ["milestone_changed", "current_focus_changed", "priority_changed"]
      - path: docs/DECISIONS.md
        role: "Stable decisions and rationale."
        update_mode: append
        read_when: ["design_question", "revisiting_old_choice"]
        update_when: ["decision_stabilized", "old_decision_superseded"]
      - path: docs/GLOSSARY.md
        role: "Shared terms, variables, labels, and naming meanings."
        update_mode: patch
        read_when: ["term_or_variable_question", "naming_question"]
        update_when: ["term_standardized", "display_name_changed"]
      - path: docs/RUNBOOK.md
        role: "How to run, validate, debug, and find outputs."
        update_mode: rewrite
        read_when: ["running_commands", "debugging", "looking_for_outputs"]
        update_when: ["command_changed", "output_path_changed", "debug_workflow_changed"]
      - path: docs/CONVENTIONS.md
        role: "Hard rules, contracts, safety constraints, and recurring practices."
        update_mode: patch
        read_when: ["before_editing", "style_or_contract_question"]
        update_when: ["rule_changed", "contract_changed", "dependency_policy_changed"]

  scaling:
    purpose: "Active details too granular for base memory."
    files:
      - path: docs/PROGRESS.md
        role: "Module/feature-level implementation checklist."
        update_mode: patch
        read_when: ["complex_status_question", "multi_module_work"]
        update_when: ["module_status_changed", "feature_completed_or_started"]
      - path: docs/MAP.md
        role: "Concept, feature, artifact, and file mappings."
        update_mode: patch
        read_when: ["locating_implementation", "tracing_artifact", "feature_mapping_question"]
        update_when: ["mapping_changed", "artifact_chain_changed", "entrypoint_changed"]

  session:
    purpose: "Useful but not-yet-stable context for the next session."
    files:
      - path: docs/SHORT_MEMORY/
        role: "Session handoff notes."
        update_mode: append
        read_when: ["resuming_long_session", "handoff_needed"]
        update_when: ["context_would_be_lost", "conclusion_not_stable_yet"]

  historical:
    purpose: "Completed records for later retrospection, not active work routing."
    files:
      - path: docs/archive/
        role: "Historical notes, retrospectives, failed explorations, and snapshots."
        update_mode: append
        read_when: ["historical_question", "reconstructing_old_context"]
        update_when: ["exploration_completed", "retrospective_needed", "old_material_archived"]
